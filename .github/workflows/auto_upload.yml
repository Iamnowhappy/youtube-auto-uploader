name: YouTube 자동 업로드

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
  
concurrency:
  group: youtube-auto-upload
  cancel-in-progress: false
  
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      
      - name: YouTube 자동 업로드 실행
        env:
          GOOGLE_SHEET_NAMES: ${{ secrets.GOOGLE_SHEET_NAMES }}
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_CH1: ${{ secrets.YOUTUBE_TOKEN_JSON_CH1 }}
          YOUTUBE_TOKEN_JSON_CH2: ${{ secrets.YOUTUBE_TOKEN_JSON_CH2 }}
          YOUTUBE_TOKEN_JSON_CH3: ${{ secrets.YOUTUBE_TOKEN_JSON_CH3 }}
          YOUTUBE_TOKEN_JSON_CH4: ${{ secrets.YOUTUBE_TOKEN_JSON_CH4 }}
          YOUTUBE_TOKEN_JSON_CH5: ${{ secrets.YOUTUBE_TOKEN_JSON_CH5 }}
          YOUTUBE_TOKEN_JSON_CH6: ${{ secrets.YOUTUBE_TOKEN_JSON_CH6 }}
          YOUTUBE_TOKEN_JSON_CH7: ${{ secrets.YOUTUBE_TOKEN_JSON_CH7 }}
          YOUTUBE_TOKEN_JSON_CH8: ${{ secrets.YOUTUBE_TOKEN_JSON_CH8 }}
          YOUTUBE_TOKEN_JSON_CH9: ${{ secrets.YOUTUBE_TOKEN_JSON_CH9 }}
        run: python upload.py
